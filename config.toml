baseURL = "https://ryeowon0724.github.io/myprofle-RWK/"
languageCode = "ko-KR"
title = "Ryeowon's Dev Log"
theme = ["github.com/ismd/hugo-theme-vng-blue"]

[params]
  description = "컴퓨터인공지능학부 2학년 개인 소개 웹사이트"
  homeEventPosition = "top"  # "top", "bottom", "none" 중 선택
  homeToBlogText = "블로그로"
  author = "김려원"

  # Giscus 댓글 기능 사용 시 (선택 사항)
  [params.giscus]
    enable = false

  # 소셜 링크 설정 (사용할 플랫폼만 남겨두세요)
  [params.social]
    github = "https://github.com/ryeowon0724"
    telegram = "https://t.me/your_id"

# 기존에 있던 모듈 설정은 그대로 유지합니다
[module]
  [module.hugoVersion]
    extended = true
    min = "0.158.0"
  
  [[module.imports]]
    path = "github.com/ismd/hugo-theme-vng-blue"